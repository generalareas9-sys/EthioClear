<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EthioClear favicon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#1B2A6B"/>
    </linearGradient>
    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="dc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8F0FE"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Ethiopian ribbon swooshes -->
  <path d="M 30,370 Q 85,220 175,128" stroke="#078930" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M 15,405 Q 75,255 160,163" stroke="#FCDD09" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 2,440 Q 65,290 148,198" stroke="#DA121A" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Document body -->
  <g transform="translate(138, 58)">
    <path d="M 12,0 L 196,0 L 236,40 L 236,296 Q 236,308 224,308 L 12,308 Q 0,308 0,296 L 0,12 Q 0,0 12,0 Z"
          fill="url(#dc)" stroke="white" stroke-width="7"/>
    <path d="M 196,0 L 236,40 L 196,40 Z" fill="#CBD5E1" stroke="white" stroke-width="5"/>
    <rect x="28" y="88"  width="150" height="17" rx="8.5" fill="#1B2A6B" opacity="0.8"/>
    <rect x="28" y="121" width="150" height="17" rx="8.5" fill="#1B2A6B" opacity="0.8"/>
    <rect x="28" y="154" width="115" height="17" rx="8.5" fill="#1B2A6B" opacity="0.7"/>
    <rect x="28" y="187" width="82"  height="17" rx="8.5" fill="#2563EB" opacity="0.5"/>
  </g>

  <!-- Verification shield -->
  <g transform="translate(262, 245)">
    <path d="M 80,0 L 162,30 L 162,96 Q 162,162 80,184 Q 0,162 0,96 L 0,30 Z"
          fill="url(#sh)" stroke="white" stroke-width="8"/>
    <polyline points="36,92 66,124 126,60"
              fill="none" stroke="white" stroke-width="19"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
