<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EthioClear favicon">
  <!-- Background circle to give a strong shape at small sizes -->
  <circle cx="32" cy="32" r="30" fill="#1E7F3A"/>

  <!-- Abstract Ethiopia-like silhouette (stylized blob) -->
  <path d="M18 18c6-4 18-6 26-2 4 2 8 6 6 12-2 8-6 12-10 14-6 3-16 6-24 0-4-3-8-10-6-18 1-5 6-8 8-10z" fill="#F2C94C"/>

  <!-- Certificate / badge: rounded rectangle with folded corner and checkmark -->
  <g transform="translate(36,36) scale(0.8)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-10" y="-12" width="20" height="18" rx="2" fill="#ffffff" fill-opacity="0.06" stroke="none"/>
    <polyline points="-6 -4 -1 2 6 -6" stroke="#ffffff" stroke-width="3" fill="none" />
    <!-- small circular badge behind the rect for contrast -->
  </g>

  <!-- Slight inner ring for clarity at small sizes -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#155724" stroke-width="1" opacity="0.25"/>
</svg>