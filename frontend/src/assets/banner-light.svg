<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ethiopia-inspired background">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F8FBF9" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="gAccent" x1="0" x2="1">
      <stop offset="0%" stop-color="#E6F4EA" />
      <stop offset="100%" stop-color="#DFF2E4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#g1)" />

  <!-- Very subtle abstract map-like shape on the left -->
  <path d="M120 240c40-30 130-60 220-40 90 20 170 60 260 40 90-20 170-80 260-90" fill="none" stroke="#EAF6ED" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Digital grid / network hint -->
  <g stroke="#DBEFE0" stroke-width="1" opacity="0.9">
    <path d="M0 280 L1200 280" />
    <path d="M0 300 L1200 300" />
    <path d="M0 320 L1200 320" />
    <g transform="translate(160,40)" opacity="0.9">
      <circle cx="0" cy="200" r="28" fill="#BEEAC8" opacity="0.25" />
      <circle cx="280" cy="170" r="20" fill="#DFF6E6" opacity="0.18" />
    </g>
  </g>

  <!-- Stylized certificate outline on the right, very faint -->
  <g transform="translate(880,120) scale(1)" opacity="0.9">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#ffffff" stroke="#D1EAD6" stroke-width="2" opacity="0.6" />
    <circle cx="34" cy="96" r="18" fill="#F2C94C" opacity="0.9" />
    <polyline points="24,96 34,104 52,84" fill="none" stroke="#155724" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  </g>

  <!-- Low-opacity decorative geometric shapes to add modern feel -->
  <g opacity="0.45">
    <rect x="40" y="20" width="220" height="80" rx="14" fill="url(#gAccent)" opacity="0.7" />
    <rect x="320" y="40" width="260" height="60" rx="12" fill="#F8FBF9" opacity="0.6" />
  </g>
</svg>