<!doctype html>
<!--
  index.html — Vite entry point.
  Loads src/main.jsx as an ES module, which mounts the React app into #root.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EthioClear — University Prototype</title>
    <meta
      name="description"
      content="EthioClear: an academic prototype demonstrating a digitized criminal record certificate application workflow. Not a real government system."
    />
    <!-- Favicon: EthioClear refined icon (document + shield + Ethiopian ribbons) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/src/assets/favicon-ethiopia.svg" />

    <!-- PNG fallbacks and multi-size icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Prevent flash of incorrect theme before React renders -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('ethio_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
