<!doctype html>
<!--
  index.html — Vite entry point.
  Loads src/main.jsx as an ES module, which mounts the React app into #root.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EthioClear — University Prototype</title>
    <meta
      name="description"
      content="EthioClear: an academic prototype demonstrating a digitized criminal record certificate application workflow. Not a real government system."
    />
    <!-- Favicon: simplified Ethiopia + certificate badge -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon-ethiopia.svg" />
    <link rel="alternate icon" href="/src/assets/favicon-ethiopia.svg" />

    <!-- PNG fallbacks and multi-size icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
