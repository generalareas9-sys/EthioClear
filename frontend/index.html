<!doctype html>
<!--
  index.html — Vite entry point.
  Loads src/main.jsx as an ES module, which mounts the React app into #root.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EthioClear — University Prototype</title>
    <meta
      name="description"
      content="EthioClear: an academic prototype demonstrating a digitized criminal record certificate application workflow. Not a real government system."
    />
    <!-- Fonts for EthioClear: Outfit (sans), DM Serif Display (headings), JetBrains Mono (mono), Noto Sans Ethiopic (Amharic, Tigrinya) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon: EthioClear refined icon (document + shield + Ethiopian ribbons) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/src/assets/favicon-ethiopia.svg" />

    <!-- PNG fallbacks and multi-size icons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Pure light-only theme initializer -->
    <script>
      (function() {
        try {
          localStorage.removeItem('ethio_theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
