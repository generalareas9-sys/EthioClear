<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="950" height="250" role="img" aria-label="EthioClear Logo">
  <defs>
    <!-- Shield Subtle Gradient (#1E6FE8 to #0B2A6F) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FE8" />
      <stop offset="100%" stop-color="#0B2A6F" />
    </linearGradient>
  </defs>

  <!-- ==========================================
       SYMBOL (Left Side)
       Centered vertically around y=125
       ========================================== -->
  <g transform="translate(10, 15)">
    <!-- Three smooth ribbons sweeping up from bottom-left behind document -->
    <!-- Green (#0E8A3E) -->
    <path d="M 22 200 C 35 125 75 75 130 52 C 112 75 75 130 65 200 Z" fill="#0E8A3E" />
    <!-- Yellow (#FCCB0B) -->
    <path d="M 12 205 C 28 140 65 92 115 72 C 98 94 65 145 52 205 Z" fill="#FCCB0B" />
    <!-- Red (#E11D1D) -->
    <path d="M 2 210 C 20 155 55 110 102 92 C 85 115 52 165 40 210 Z" fill="#E11D1D" />

    <!-- Document Frame & Shape (White with folded top-right corner) -->
    <g transform="translate(68, 18)">
      <!-- Document Outer Navy Frame/Shadow -->
      <path d="M 6 0 L 100 0 L 138 38 L 138 174 C 138 180 134 184 128 184 L 6 184 C 0 184 -4 180 -4 174 L -4 10 C -4 4 0 0 6 0 Z" fill="#0B2A6F" />
      
      <!-- Document Body (White) -->
      <path d="M 10 4 L 98 4 L 134 40 L 134 170 C 134 174 130 178 126 178 L 10 178 C 6 178 2 174 2 170 L 2 12 C 2 8 6 4 10 4 Z" fill="#FFFFFF" />

      <!-- Folded Corner Triangle (Bright Blue #1E6FE8) -->
      <path d="M 98 4 L 134 40 L 98 40 Z" fill="#1E6FE8" />

      <!-- Three Navy Text Lines (#0B2A6F) -->
      <rect x="24" y="60" width="76" height="13" rx="6.5" fill="#0B2A6F" />
      <rect x="24" y="85" width="76" height="13" rx="6.5" fill="#0B2A6F" />
      <rect x="24" y="110" width="54" height="13" rx="6.5" fill="#0B2A6F" />
    </g>

    <!-- Verification Shield (Overlapping lower-right of document) -->
    <g transform="translate(142, 110)">
      <!-- White Outer Border / Outline for Contrast -->
      <path d="M 44 0 L 88 18 L 88 56 C 88 94 44 112 44 112 C 44 112 0 94 0 56 L 0 18 Z" fill="#FFFFFF" />

      <!-- Shield Body with Gradient (#1E6FE8 -> #0B2A6F) -->
      <path d="M 44 6 L 82 22 L 82 56 C 82 89 44 104 44 104 C 44 104 6 89 6 56 L 6 22 Z" fill="url(#shieldGrad)" />

      <!-- Bold White Checkmark -->
      <path d="M 24 53 L 37 67 L 64 36" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==========================================
       WORDMARK & TAGLINE (Right Side)
       ========================================== -->
  <g transform="translate(265, 0)">
    <!-- Wordmark: "Ethio" in #0B2A6F, "Clear" in #1E6FE8 -->
    <text x="0" y="125" font-family="'Outfit', 'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="88" letter-spacing="-1">
      <tspan fill="#0B2A6F">Ethio</tspan><tspan fill="#1E6FE8">Clear</tspan>
    </text>

    <!-- Tagline: "Your Criminal Record Certificate, Simplified" in Medium-Weight Navy -->
    <text x="4" y="166" font-family="'Outfit', 'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="500" font-size="22.5" fill="#0B2A6F" letter-spacing="0.2">
      Your Criminal Record Certificate, Simplified
    </text>

    <!-- Accent Line: Split into Green, Yellow, and Red segments -->
    <g transform="translate(4, 185)">
      <!-- Green segment (#0E8A3E) -->
      <rect x="0" y="0" width="170" height="4" rx="2" fill="#0E8A3E" />
      <!-- Yellow segment (#FCCB0B) -->
      <rect x="178" y="0" width="170" height="4" rx="2" fill="#FCCB0B" />
      <!-- Red segment (#E11D1D) -->
      <rect x="356" y="0" width="170" height="4" rx="2" fill="#E11D1D" />
    </g>
  </g>
</svg>
